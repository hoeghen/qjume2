name: Deploy to Firebase

# Publishes the app running on the real backend — Firestore, Auth, Cloud
# Functions — plus the security rules, indexes, and RTDB rules it depends on.
#
# Separate from deploy.yml, which ships the mock backend to GitHub Pages and
# needs no secrets at all: that workflow keeps working whether or not this
# one is ever configured. This one skips itself cleanly rather than failing
# until FIREBASE_PROJECT_ID is set — see CLAUDE.md decision 10's rollout
# checklist for what that setup involves.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the version the Cloud Functions target.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install function dependencies
        run: npm --prefix functions ci

      - name: Build the app against the real backend
        env:
          # src/lib/firebase.ts defaults VITE_USE_EMULATORS to true when
          # unset - right for local dev, wrong for anything actually
          # deployed. Without this, the built app tries to reach the
          # Firebase emulators at 127.0.0.1, which on a real user's device
          # is their own device, not this build server.
          VITE_USE_EMULATORS: 'false'
          # Setting VITE_FIREBASE_API_KEY (rather than VITE_BACKEND=firebase
          # directly) is what src/lib/mock/mode.ts infers the backend from —
          # stating the backend explicitly here would risk the two disagreeing
          # if one is ever changed without the other.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          # Without this, src/lib/push.ts calls getToken() with no VAPID key
          # at all, so every push registration fails — nobody's fcmTokens
          # ever gets a token, and sweepMilestones has nothing to send push
          # notifications to. From Firebase Console > Project Settings >
          # Cloud Messaging > Web configuration > Web Push certificates.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy rules, indexes, functions and hosting
        # Rules and indexes first: a function that relies on an index Firestore
        # hasn't built yet, or a rule the client side already assumes, should
        # never be the thing that goes out first.
        #
        # --force: --non-interactive alone stops short of actually answering
        # the one prompt that still comes up — deleting a Cloud Function that
        # no longer exists in source. Without it, removing a function here
        # (as happened when mirrorPresence was replaced by the explicit
        # serving toggle) aborts the *entire* functions deploy with nothing
        # applied, leaving whatever the client already expects unbuilt on the
        # server. Every other prompt --non-interactive already answers safely
        # by refusing rather than guessing; this is the one Firebase gates
        # behind a separate flag regardless.
        run: |
          npx firebase-tools deploy \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --only firestore:rules,firestore:indexes,database,functions,hosting \
            --non-interactive \
            --force
