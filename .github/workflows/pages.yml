name: Demo to GitHub Pages

# Publishes the no-backend demo. This is not the app: it runs entirely in the
# browser with invented data, so it needs no Firebase project, no secrets and
# no billing. The real build deploys to Firebase Hosting instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the demo
        env:
          VITE_DEMO: 'true'
          # Pages serves a project repo from /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Add the SPA fallback
        # Pages has no rewrite rule, so a deep link like /shop would 404.
        # Serving index.html as the 404 page lets the router handle it.
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
