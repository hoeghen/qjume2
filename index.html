<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3d3b47" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!--seo:start--><title>Qjume</title><!--seo:end-->
    <!--
      The page's text sits in #root as plain HTML for anything that reads it
      without running JavaScript (src/lib/seoBody.ts). A browser that runs
      JavaScript is about to replace it with the app, so it is hidden there
      from the first paint rather than flashing up unstyled. If the app has
      not started within a few seconds, it is shown after all, so a failed
      load still leaves something to read. The ink background is set here
      too, so the wait is the app's own colour rather than white.
    -->
    <script>
      document.documentElement.classList.add('js');
      setTimeout(function () {
        document.documentElement.classList.remove('js');
      }, 4000);
    </script>
    <style>
      html, body { background: #3d3b47; }
      .js .static-page { display: none; }
    </style>
  </head>
  <body>
    <div id="root"><!--body:start--><!--body:end--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
